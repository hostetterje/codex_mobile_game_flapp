<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tipsy Tap</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section id="game" class="game" aria-label="Beer mug dodge mobile game" role="application">
        <div class="pub-light"></div>
        <div class="pub-floor"></div>
        <div id="mug" class="mug" aria-hidden="true"></div>
        <div id="obstacles" class="obstacles" aria-hidden="true"></div>
        <div id="score" class="score" aria-live="polite">0</div>

        <div id="startHint" class="overlay hint">
          <h1>Tipsy Tap</h1>
          <p>Tap to steer the beer around bar tops</p>
        </div>

        <div id="gameOver" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
          <div class="card">
            <h2 id="gameOverTitle">Beer Spilled!</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="restartBtn" type="button">Pour Again</button>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
